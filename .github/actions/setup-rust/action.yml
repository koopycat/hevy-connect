name: Set up Rust
description: C toolchain, Rust toolchain and just, for the homelab runners.

runs:
  using: composite
  steps:
    # Linking and the ring crate need a C compiler. The homelab runner image
    # carries one (infra: SYS-ci-runner); install it only where it is missing.
    # Jobs may sudo there.
    - shell: bash
      run: |
        if ! command -v cc >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential
        fi

    # The version matches rust-version in Cargo.toml.
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: "1.96"
        components: clippy, rustfmt

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
