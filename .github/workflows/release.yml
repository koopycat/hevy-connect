name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINARY_NAME: hevy-axi

jobs:
  test:
    name: Test release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Expected a SemVer tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          # A prerelease suffix on the tag is allowed; the core version must match.
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag%%[-+]*}" != "$tracked" ]]; then
            echo "::error title=Tag does not match Cargo.toml::tag ${GITHUB_REF_NAME} does not match version ${tracked}; bump Cargo.toml, commit it on main, then tag that commit"
            exit 1
          fi

      - uses: ./.github/actions/setup-rust

      # Format, Clippy with warnings denied, tests, release build.
      - run: just check

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest hosted image so that the binary runs
          # on older glibc. Both macOS targets build on the arm64 runner.
          - { os: linux, arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: darwin, arch: arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { os: darwin, arch: amd64, runner: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Add the target
        run: rustup target add "${{ matrix.target }}"

      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="${BINARY_NAME}_${version}_${OS}_${ARCH}"
          package_dir="dist/${archive}"

          cargo build --locked --release --target "$TARGET"

          mkdir -p "$package_dir"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$package_dir/"
          cp README.md LICENSE "$package_dir/"

          # The binary reports the Cargo.toml version, which is the tag without
          # a prerelease suffix. This checks every target that can run here.
          if [[ "$TARGET" != "x86_64-apple-darwin" ]]; then
            actual_version="$("${package_dir}/${BINARY_NAME}" --version)"
            if [[ "$actual_version" != "${version%%[-+]*}" ]]; then
              echo "::error title=Version mismatch::Expected ${version%%[-+]*}, got ${actual_version}"
              exit 1
            fi
          fi

          tar -C dist -czf "dist/${archive}.tar.gz" "$archive"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum "${BINARY_NAME}"_* | LC_ALL=C sort -k2 > checksums.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease=true)
          else
            prerelease_args+=(--prerelease=false)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # An existing release, including a draft, is converged to the
            # intended published state instead of being left as a draft.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "${BINARY_NAME} ${GITHUB_REF_NAME}" \
              --draft=false \
              "${prerelease_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "${BINARY_NAME} ${GITHUB_REF_NAME}" \
              "${prerelease_args[@]}"
          fi

      - name: Verify release is published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            expected_prerelease=true
          fi

          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "${state%% *}" != "false" ]]; then
            echo "::error title=Release is still a draft::${GITHUB_REF_NAME} was not published"
            exit 1
          fi
          if [[ "${state##* }" != "$expected_prerelease" ]]; then
            echo "::error title=Wrong release classification::expected prerelease=${expected_prerelease}, got ${state##* }"
            exit 1
          fi

          echo "${GITHUB_REF_NAME} is published (prerelease=${state##* })"

  homebrew:
    name: Update Homebrew formula
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The push below needs the App token the checkout stores.
          repository: koopycat/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Generate formula
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "dist/${BINARY_NAME}_${version}_$1.tar.gz" | awk '{print $1}'; }
          darwin_arm64_sha="$(sha darwin_arm64)"
          darwin_amd64_sha="$(sha darwin_amd64)"
          linux_arm64_sha="$(sha linux_arm64)"
          linux_amd64_sha="$(sha linux_amd64)"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/hevy-axi.rb <<FORMULA
          class HevyAxi < Formula
            desc "Agent-ergonomic CLI for the Hevy Public API"
            homepage "https://github.com/koopycat/hevy-connect"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/koopycat/hevy-connect/releases/download/v#{version}/hevy-axi_#{version}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              end

              on_intel do
                url "https://github.com/koopycat/hevy-connect/releases/download/v#{version}/hevy-axi_#{version}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/koopycat/hevy-connect/releases/download/v#{version}/hevy-axi_#{version}_linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              end

              on_intel do
                url "https://github.com/koopycat/hevy-connect/releases/download/v#{version}/hevy-axi_#{version}_linux_amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "hevy-axi"
            end

            test do
              assert_equal version.to_s, shell_output("#{bin}/hevy-axi --version").strip
            end
          end
          FORMULA

          ruby -c homebrew-tap/Formula/hevy-axi.rb

      - name: Commit and push formula
        working-directory: homebrew-tap
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- Formula/hevy-axi.rb)" ]]; then
            echo "Formula is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/hevy-axi.rb
          git commit -m "Update hevy-axi to ${GITHUB_REF_NAME}"
          git push
