name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The homelab runners (SYS-ci-runner): disposable VM, internet only.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The homelab image has no Node, and pnpm's installer needs one, so Node
      # comes first. lts/* follows the active LTS release: 24 now, 26 from
      # 2026-10-28. engines.node in package.json is the supported floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      # pnpm reads its version from the packageManager field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile

      # Lint, format, generated-types drift, typecheck, tests, build.
      - run: pnpm check
