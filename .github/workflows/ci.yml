name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The homelab runners (SYS-ci-runner): disposable VM, internet only.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 30
    env:
      # The runner checks out into a directory named after the runner, and
      # the cache version hashes its paths: a target directory inside the
      # checkout would never hit across jobs.
      CARGO_TARGET_DIR: /home/runner/cargo-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # Dependencies are compiled for clippy, tests and release; restore them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: true

      # Format, Clippy with warnings denied, tests, release build.
      - run: just check
