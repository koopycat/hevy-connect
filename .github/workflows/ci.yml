name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The homelab runners (SYS-ci-runner): disposable VM, internet only.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 30
    env:
      # The runner checks out into a directory named after the runner, and
      # the cache version hashes its paths: a target directory inside the
      # checkout would never hit across jobs.
      CARGO_TARGET_DIR: /home/runner/cargo-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # Dependencies are compiled for clippy, tests and release; restore them.
      # Exact key, so stale artifacts never accumulate. Only main saves.
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/.cargo/registry
            /home/runner/cargo-target
          key: cargo-${{ hashFiles('Cargo.lock', '.github/actions/setup-rust/action.yml') }}

      # Format, Clippy with warnings denied, tests, release build.
      - run: just check

      - if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/.cargo/registry
            /home/runner/cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
