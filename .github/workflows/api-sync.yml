name: Check Hevy API

on:
  schedule:
    # Weekly, Mondays at 06:17 UTC. Hevy asks scheduled syncs to avoid xx:00.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails when Hevy's live OpenAPI document differs from the committed capture.
  # The failed run is the alert: adopt the change locally with `just api-sync`.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - run: just api-sync-check
