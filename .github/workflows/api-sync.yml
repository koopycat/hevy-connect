name: Sync Hevy API

on:
  schedule:
    # Weekly, Mondays at 06:17 UTC. Hevy asks scheduled syncs to avoid xx:00.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# No token permissions by default. Each job requests only what it needs.
permissions: {}

concurrency:
  group: api-sync
  cancel-in-progress: false

jobs:
  # Runs project code (pnpm install, pnpm check) and reads third-party data. It
  # holds no write credential, and its checkout does not persist one. It runs on
  # the homelab runners (SYS-ci-runner): disposable VM, internet only.
  refresh:
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The homelab image has no Node, and pnpm's installer needs one, so Node
      # comes first. Its pnpm cache is off because setup-node would need pnpm
      # before pnpm/action-setup has installed it. lts/* follows the active LTS
      # release (24 now, 26 from 2026-10-28).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      # pnpm reads its version from the packageManager field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile

      - run: scripts/api-sync-refresh.sh "${{ runner.temp }}/api-sync"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-sync
          path: ${{ runner.temp }}/api-sync
          if-no-files-found: error
          retention-days: 7

  # Holds the write token. Runs only the repository's own git and gh scripts,
  # from the default branch, on the output of the refresh job.
  publish:
    needs: refresh
    # Pinned to one image instead of ubuntu-latest, so an image change never
    # reaches this write-token job unreviewed. Renovate proposes the bumps.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the default branch, even when dispatched from another branch.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: api-sync
          path: ${{ runner.temp }}/api-sync

      - run: scripts/api-sync-publish.sh "${{ runner.temp }}/api-sync"
