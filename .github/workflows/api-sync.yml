name: Sync Hevy API

on:
  schedule:
    # Weekly, Mondays at 06:17 UTC. Hevy asks scheduled syncs to avoid xx:00.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# No token permissions by default. Each job requests only what it needs.
permissions: {}

concurrency:
  group: api-sync
  cancel-in-progress: false

jobs:
  # Runs project code (pnpm install, pnpm check) and reads third-party data. It
  # holds no write credential, and its checkout does not persist one. It runs on
  # the homelab runners (SYS-ci-runner): disposable VM, internet only.
  refresh:
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The homelab image has no Node, and pnpm's installer needs one, so Node
      # comes first. Its pnpm cache is off because setup-node would need pnpm
      # before pnpm/action-setup has installed it.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # pnpm reads its version from the packageManager field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile

      - run: scripts/api-sync-refresh.sh "${{ runner.temp }}/api-sync"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-sync
          path: ${{ runner.temp }}/api-sync
          if-no-files-found: error
          retention-days: 7

  # Holds the write token. Runs only the repository's own git and gh scripts,
  # from the default branch, on the output of the refresh job.
  publish:
    needs: refresh
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, and this job holds
    # the write token.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Always the default branch, even when dispatched from another branch.
          ref: ${{ github.event.repository.default_branch }}

      # No Node 24 release yet (v5 and v6 still declare node20): stays on v4.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-sync
          path: ${{ runner.temp }}/api-sync

      - run: scripts/api-sync-publish.sh "${{ runner.temp }}/api-sync"
