# Once per clone: pre-commit install. CI repeats the scan (.github/workflows/security.yml),
# so a skipped hook (--no-verify) is caught there.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # The commit hook scans the staged changes; the push hook scans every commit
  # that is not on origin/main yet, which also catches --no-verify.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-push
        name: Detect hardcoded secrets in unpushed commits
        entry: gitleaks git --redact --verbose --log-opts=origin/main..HEAD
        stages: [pre-push]
        always_run: true
