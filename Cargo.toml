[package]
name = "hevy-axi"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Agent-ergonomic CLI for the Hevy Public API"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
serde_toon = "0.3"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
tiny_http = "0.12.0"

[[example]]
name = "api-sync"
path = "examples/api_sync.rs"
test = true
